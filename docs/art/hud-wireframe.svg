<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">Facet TD desktop phone and landscape HUD wireframe</title><desc id="desc">Static design study. All map geometry, values and gameplay states are illustrative.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1400" height="860" rx="0" fill="#FAF8F2" stroke="none" /><text x="32" y="50" font-size="32" fill="#24343B" font-weight="600">Let the arena lead. Keep cells clear.</text><text x="32" y="81" font-size="18" fill="#526169" font-weight="400">Desktop HUD floats in safe corners. Phone sheets reserve space below the canvas.</text><text x="32" y="130" font-size="20" fill="#24343B" font-weight="600">Desktop / ≥1100 px wide and ≥600 px high</text><rect x="32" y="150" width="810" height="64" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="48" y="179" font-size="18" fill="#24343B" font-weight="600">Status bar</text><text x="48" y="204" font-size="14" fill="#526169" font-weight="400">Mode • phase • wave • HP • gold • time • menu</text><text x="890" y="130" font-size="20" fill="#24343B" font-weight="600">Phone portrait / 390 × 844</text><rect x="890" y="150" width="350" height="94" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="906" y="179" font-size="18" fill="#24343B" font-weight="600">Status, two rows</text><text x="906" y="204" font-size="14" fill="#526169" font-weight="400">HP and phase always visible.</text><rect x="890" y="256" width="350" height="212" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="906" y="285" font-size="18" fill="#24343B" font-weight="600">Arena canvas</text><text x="906" y="310" font-size="14" fill="#526169" font-weight="400">Precise picking requires zoom.</text><rect x="890" y="480" width="350" height="64" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="906" y="509" font-size="18" fill="#24343B" font-weight="600">Camera controls</text><text x="906" y="534" font-size="14" fill="#526169" font-weight="400">48 px targets / no hover dependency</text><rect x="890" y="556" width="350" height="188" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="906" y="585" font-size="18" fill="#24343B" font-weight="600">Context sheet</text><text x="906" y="610" font-size="14" fill="#526169" font-weight="400">Selected gem + valid action + Inspect / Book / More</text><text x="32" y="696" font-size="20" fill="#24343B" font-weight="600">Short landscape / height &lt;600 px</text><rect x="32" y="716" width="520" height="108" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="48" y="745" font-size="18" fill="#24343B" font-weight="600">Board at remaining height</text><text x="48" y="770" font-size="14" fill="#526169" font-weight="400">Status 48 px / canvas uses measured remainder</text><rect x="564" y="716" width="278" height="108" rx="4" fill="#E8E5DE" stroke="#75838A" /><text x="580" y="745" font-size="18" fill="#24343B" font-weight="600">Inspector, 240 px wide</text><text x="580" y="770" font-size="14" fill="#526169" font-weight="400">Internal scroll / sticky action row</text><text x="890" y="791" font-size="17" fill="#24343B" font-weight="400">Tablet: collapsible 280 px inspector.</text><text x="890" y="819" font-size="17" fill="#24343B" font-weight="400">320 px: wrap labels; never shrink targets.</text><rect x="32" y="226" width="810" height="414" fill="#D9DED1" stroke="#75838A" rx="4" /><text x="275" y="300" font-size="18" fill="#24343B" font-weight="600">Arena / projected playable cells</text><text x="275" y="327" font-size="15" fill="#526169" font-weight="400">Fit around HUD exclusion zones.</text><rect x="44" y="238" width="210" height="72" fill="#22362D" stroke="none" rx="8" /><text x="58" y="267" font-size="17" fill="#F1F6EE" font-weight="400">Build guidance</text><text x="58" y="290" font-size="14" fill="#B7C7BF" font-weight="400">Top-left safe corner</text><rect x="44" y="468" width="232" height="160" fill="#22362D" stroke="none" rx="8" /><text x="58" y="498" font-size="17" fill="#F1F6EE" font-weight="400">Gem inspector</text><text x="58" y="525" font-size="14" fill="#B7C7BF" font-weight="400">Bottom-left safe corner</text><text x="58" y="552" font-size="14" fill="#B7C7BF" font-weight="400">Selected gem + action</text><rect x="400" y="568" width="430" height="60" fill="#22362D" stroke="none" rx="8" /><text x="416" y="604" font-size="17" fill="#F1F6EE" font-weight="400">Bottom-right command dock</text></g></svg>