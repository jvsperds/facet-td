<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facet TD · Castle walls & gem towers</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #25282c;
      color: #f4f3ef;
      font:
        16px "Segoe UI",
        Arial,
        sans-serif;
    }
    header,
    footer {
      padding: 20px 28px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 24px;
      margin: 4px 0 8px;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: #bdc3c7;
      line-height: 1.5;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 0.13em;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button,
    select {
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid #818990;
      border-radius: 4px;
      background: #393e43;
      color: #f4f3ef;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: #d4d8dc;
      color: #202429;
    }
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    #stage {
      position: relative;
      height: min(68vw, 690px);
      min-height: 420px;
      background: #656d74;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0);
      text-align: center;
      white-space: nowrap;
      color: #202429;
      font-size: 14px;
    }
    .label strong {
      display: block;
      font-weight: 600;
    }
    .label[data-extended],
    .label[data-connections] {
      white-space: normal;
      width: 112px;
      font-size: 11px;
      line-height: 1.15;
    }
    #identity {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 8px 28px 16px;
      color: #bdc3c7;
      font-size: 13px;
    }
    #identity[hidden] {
      display: none;
    }
    #identity article {
      flex: 1 1 190px;
    }
    #identity h3 {
      margin: 0 0 6px;
      color: #f4f3ef;
      font-size: 15px;
    }
    #identity p {
      margin: 4px 0;
      line-height: 1.4;
    }
    #identity strong {
      color: #d9e6ed;
    }
    .health {
      position: absolute;
      width: 44px;
      height: 6px;
      transform: translate(-50%, -100%);
      border: 1px solid #202429;
      background: linear-gradient(
        90deg,
        #4fc36b var(--fill),
        #3a3f44 var(--fill)
      );
    }
    .health[data-hp]::before {
      content: attr(data-hp);
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: #f4f3ef;
      font-weight: 700;
      font-size: 14px;
      text-shadow:
        0 0 2px #202429,
        0 0 2px #202429;
    }
    footer {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    input {
      width: 180px;
      min-height: 48px;
      vertical-align: middle;
      accent-color: #d4d8dc;
    }
    #error {
      padding: 20px;
    }
    @media (max-width: 600px) {
      header,
      footer {
        padding: 16px;
      }
      h1 {
        font-size: 21px;
      }
      .label {
        font-size: 11px;
      }
      #stage {
        height: 570px;
      }
    }
  </style>
  <header>
    <div>
      <p class="kicker">FACET TD / P1.5 / MODEL STUDY 01</p>
      <h1>Castle walls. Gem towers.</h1>
      <p>46 tower designs · connected castle walls and ambient particles.</p>
    </div>
    <nav aria-label="Model view">
      <button id="iso" aria-pressed="true">Isometric</button
      ><button id="top" aria-pressed="false">Top view</button
      ><button id="turn">Turn 90°</button
      ><button id="gray" aria-pressed="false">Grayscale</button>
    </nav>
  </header>
  <main>
    <div id="stage"><div class="labels" id="labels"></div></div>
    <p id="error" role="alert" hidden></p>
    <section id="identity" aria-label="Tower effects and design cues"></section>
  </main>
  <footer>
    <label
      >Inspect
      <select id="inspect">
        <option value="">Full study</option>
        <option value="wall">Wall joins</option>
      </select></label
    >
    <button id="play" aria-pressed="false">Replay wall join</button
    ><label
      >Merge
      <input
        id="merge"
        type="range"
        min="0"
        max="1"
        value="1"
        step="0.01" /></label
    ><button id="variation">New masonry variation</button
    ><button id="walk" aria-pressed="true">Pause target</button>
    <button id="particles" aria-pressed="true">Ambient particles</button>
    <p id="status" role="status">Connected · variation 1</p>
  </footer>
  <script type="module" src="./study.js"></script>
</html>
